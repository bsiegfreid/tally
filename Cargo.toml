[package]
name = "tally"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
actix-web = { version = "4.14.0", default-features = false, features = ["macros"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", default-features = false, features = ["sync"] }
